# Same rules as Scratch's app/analysis_options.yaml, plus bb-ui's bb_lints
# (tokens only, no raw colours or text styles, Gap, no Material imports).
# Run `dart analyze`: `flutter analyze` does not report plugin diagnostics.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**

plugins:
  bb_lints:
    git:
      url: https://github.com/BubbleBuffer/bb-ui
      ref: 012d9f283b8378fb7197c6238e7068dfd3205c30
      path: packages/bb_lints
