# Format, analyze and test every package (Flutter packages with flutter
# test, pure Dart ones with dart test); on pushes, also check that a
# consumer can depend on the packages through git, the way Scratch pins them.
# Public repository: GitHub-hosted runners only.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: dart format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .

  analyze:
    name: flutter analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze

  test:
    name: flutter test (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [bb_tokens, bb_ui]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: flutter test
        working-directory: packages/${{ matrix.package }}
        run: flutter test

  # Pure Dart packages: strict analysis (infos fail) and dart test.
  dart-test:
    name: dart test (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [agent_kit_core]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: dart analyze
        working-directory: packages/${{ matrix.package }}
        run: dart analyze --fatal-infos
      - name: dart test
        working-directory: packages/${{ matrix.package }}
        run: dart test

  git-consumer:
    name: git dependency resolves
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # A consumer pins bb_ui by ref name (branch or tag), as Scratch does,
      # and gets bb_tokens through bb_ui's path dependency.
      - name: Resolve and analyze a consumer
        env:
          URL: https://github.com/${{ github.repository }}.git
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/consumer"
          mkdir -p "$dir/lib"
          cat > "$dir/pubspec.yaml" <<YAML
          name: consumer
          publish_to: none
          environment:
            sdk: ^3.13.4
          dependencies:
            flutter:
              sdk: flutter
            bb_ui:
              git:
                url: $URL
                ref: $REF
                path: packages/bb_ui
          YAML
          printf "import 'package:bb_ui/bb_ui.dart';\n\nfinal colors = AppColors.light;\nconst hint = AppTooltip.hoverDelay;\n" > "$dir/lib/ui_use.dart"
          printf "import 'package:bb_ui/tokens.dart';\n\nconst radius = Radii.md;\n" > "$dir/lib/tokens_use.dart"
          cat "$dir/pubspec.yaml"
          cd "$dir"
          flutter pub get
          flutter analyze
          grep -A8 '^  bb_' pubspec.lock
