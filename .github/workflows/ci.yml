# Format, analyze and test every package (Flutter packages with flutter
# test, pure Dart ones with dart test); on pushes, also check that a
# consumer can depend on agent_kit and the external bb_ui through git.
# Public repository: GitHub-hosted runners only.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: dart format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      # When the check fails, hand over the formatted result as a patch
      # (git apply format.patch), since formatting is not run on the PC.
      - name: Save a format patch
        if: failure()
        run: dart format . && git diff > format.patch
      - name: Upload the format patch
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: format-patch
          path: format.patch

  analyze:
    name: flutter analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - run: flutter analyze

  # Raw colours in the kit's own source; the script is vendored from bb-ui
  # (see its header). The second step proves the check fails on a raw colour.
  raw-colours:
    name: no raw colours
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash scripts/test-check-raw-colours.sh
      - run: bash scripts/check-raw-colours.sh

  test:
    name: flutter test (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {package: agent_kit, dir: packages/agent_kit}
          - {package: gallery, dir: apps/gallery}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - name: flutter test
        working-directory: ${{ matrix.dir }}
        # Goldens run in the goldens job.
        run: flutter test --exclude-tags golden

  # Golden screenshots of the StatusMark specimens and of every gallery scene
  # (1440, 1000 and 390 px, light and dark), rendered with the bundled fonts.
  # Pushes and pull requests compare with the committed PNGs. A manual run
  # (workflow_dispatch) re-renders them without comparing; download the
  # artifact (`gh run download <id> -n gallery-shots`) to look at them next to
  # the mockup shots, or to commit them. Either way the PNGs are uploaded as
  # the `gallery-shots` artifact: components/ from packages/agent_kit and
  # scenes/ from apps/gallery.
  goldens:
    name: goldens
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - name: Compare with the committed goldens
        if: github.event_name != 'workflow_dispatch'
        run: |
          set -euo pipefail
          (cd packages/agent_kit && flutter test --tags golden)
          (cd apps/gallery && flutter test --tags golden)
      - name: Re-render the goldens (no comparison)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          (cd packages/agent_kit && flutter test --tags golden --update-goldens)
          (cd apps/gallery && flutter test --tags golden --update-goldens)
      - name: Collect the shots
        if: ${{ !cancelled() }}
        run: |
          mkdir -p shots/components shots/scenes
          cp packages/agent_kit/test/goldens/*.png shots/components/ || true
          cp apps/gallery/test/goldens/*.png shots/scenes/ || true
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: gallery-shots
          path: shots
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-failures
          path: |
            packages/agent_kit/test/failures
            apps/gallery/test/failures
          if-no-files-found: ignore

  # Pure Dart packages: strict analysis (infos fail) and dart test.
  dart-test:
    name: dart test (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [agent_kit_core]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get
      - name: dart analyze
        working-directory: packages/${{ matrix.package }}
        run: dart analyze --fatal-infos
      - name: dart test
        working-directory: packages/${{ matrix.package }}
        run: dart test

  git-consumer:
    name: git dependency resolves
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      # Pin agent_kit by the exact pushed commit. Its same-repository core
      # stays transitive, avoiding distinct tag/SHA sources for that package.
      # A direct bb_ui matches agent_kit's external source exactly.
      - name: Resolve and analyze a consumer
        env:
          URL: https://github.com/${{ github.repository }}.git
          REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/consumer"
          mkdir -p "$dir/lib"
          cat > "$dir/pubspec.yaml" <<YAML
          name: consumer
          publish_to: none
          environment:
            sdk: ^3.13.4
          dependencies:
            flutter:
              sdk: flutter
            agent_kit:
              git:
                url: $URL
                ref: $REF
                path: packages/agent_kit
            bb_ui:
              git:
                url: https://github.com/BubbleBuffer/bb-ui
                ref: v0.4.0
                path: packages/bb_ui
          YAML
          printf "import 'package:agent_kit/agent_kit.dart';\n\nfinal theme = BbTheme.light();\nconst sizeClass = SizeClass.compact;\n" > "$dir/lib/agent_use.dart"
          printf "import 'package:bb_ui/bb_ui.dart';\n\nfinal colors = AppColors.light;\nconst hint = AppTooltip.hoverDelay;\n" > "$dir/lib/ui_use.dart"
          printf "import 'package:bb_ui/tokens.dart';\n\nconst radius = Radii.md;\n" > "$dir/lib/tokens_use.dart"
          cat "$dir/pubspec.yaml"
          cd "$dir"
          flutter pub get
          flutter analyze
          grep -A8 -E '^  (agent_kit|bb_)' pubspec.lock
