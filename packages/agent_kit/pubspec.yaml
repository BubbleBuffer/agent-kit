name: agent_kit
description: Flutter widgets for the BubbleBuffer agent kit (theme, status, transcript, composer, chrome, workspace), built on bb_ui and agent_kit_core.
version: 0.21.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  agent_kit_core:
    path: ../agent_kit_core
  bb_ui:
    git:
      url: https://github.com/BubbleBuffer/bb-ui
      ref: 012d9f283b8378fb7197c6238e7068dfd3205c30
      path: packages/bb_ui
  lucide_icons_flutter: 3.1.25

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
